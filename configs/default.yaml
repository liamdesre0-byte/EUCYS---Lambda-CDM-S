# ΛCDM+S default configuration — published EUCYS posterior
#
# A juror who runs the repository default is requesting THIS MCMC, not a
# short package smoke test:
#
#   48 walkers × 50,000 production × 3 affine ensembles
#     = 7,200,000 posterior samples
#   burn-in 2,000  (total steps per walker = 52,000)
#   ESS target 75,000
#   entropy sector ON  (lcdm_limit: false)
#
# Fiducials and Table 1 priors are those already present in
# Bayesian_Validationn.py / analytical_solver.py.
#
# Package diagnostic (NOT the paper): configs/diagnostic.yaml
#   python scripts/run_validation.py --quick

# ---------------------------------------------------------------------------
# Four-parameter inference θ  (bayesian_validation.BackgroundParams)
# Ω_Λ here is the present entropy-sector fraction Ω_S,0 — not vacuum energy.
# ---------------------------------------------------------------------------
fiducial:
  H0: 72.8                 # km s^{-1} Mpc^{-1}; Table 1 / FIDUCIAL_H0
  Omega_Lambda: 0.685      # dimensionless; ≡ Ω_S,0; FIDUCIAL_OMEGA_LAMBDA
  k: 0.37                  # Gyr^{-1}; Γ-class rate, k ≡ γ; FIDUCIAL_K_GYR
  t_crit: 15.8             # Gyr; χ(t_crit)=1/2 midpoint; FIDUCIAL_T_CRIT_GYR
  omega_r0: 9.0e-5         # radiation fraction today (fixed, not sampled)
  S_max: 1.0               # entropy units used in w_S bookkeeping (ANALYTICAL_S_MAX)
  S_early: 1.0e-3          # early-time S_H floor (ANALYTICAL_S_EARLY)

# Table 1 factorized Gaussian priors π(θ) = Π_i N(μ_i, σ_i²)
priors:
  H0: {mu: 72.8, sigma: 2.059}            # km s^{-1} Mpc^{-1}
  Omega_Lambda: {mu: 0.685, sigma: 0.012} # dimensionless
  k: {mu: 0.37, sigma: 0.068}             # Gyr^{-1}
  t_crit: {mu: 15.8, sigma: 1.408}        # Gyr

# Coupled ODE parameterization used by analytical_solver.LCDMSParams
# (χ0 is a present-day boundary value; the Bayesian code does NOT remap
# t_crit to force χ0 ≈ 0.92 — see SCIENTIFIC_AUDIT.md).
analytical_solver:
  H0: 70.0                 # km s^{-1} Mpc^{-1}
  Omega_m0: 0.30           # matter fraction today
  Omega_r0: 9.0e-5
  gamma: 0.35              # Gyr^{-1}; logistic rate
  S_max: 1.0
  S_early: 1.0e-3
  chi0: 0.92               # χ(a=1) in the ODE solver
  Obh2: 0.02237
  z_max: 1100.0
  n_eval: 2000
  rtol: 1.0e-8
  atol: 1.0e-10
  temperature_mode: dynamical_horizon   # or de_sitter

# Published EUCYS MCMC (written report)
# 48 × 50,000 × 3 = 7,200,000 posterior samples after discarding burn-in.
mcmc:
  seed: 8
  steps: 50000             # production steps kept per walker after burn-in
  chains: 3                # independent affine ensembles
  burn: 2000               # discarded steps per walker (total = 52,000)
  walkers: 48
  method: affine           # metropolis | affine | differential_evolution
  step_frac: 0.4           # Metropolis width as a fraction of prior σ
  nlive: 25
  ns_iter: 100
  theory_nsteps: 400       # background RK steps inside ModifiedCLASS
  ess_min: 75000.0         # published ESS target
  rhat_max: 1.1
  thin: 1
  # Published ΛCDM+S samples the logistic entropy sector.
  # lcdm_limit: true freezes χ(t) and does NOT reproduce the paper.
  lcdm_limit: false
  skip_cmb: false
  skip_prior_predictive: false
  ppc_runs: 200
  no_artifacts: false
  skip_validation: false
  no_getdist: false

paths:
  outdir: results
  data_dir: null           # optional folder with pantheon_plus.csv / des_sny5.csv
  export_dir: theory_export
  validation_out: lcdms_validation_out
  figures: figures
