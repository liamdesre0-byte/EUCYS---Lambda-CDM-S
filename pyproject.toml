[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcdm-plus-s"
version = "2.1.0"
description = "ΛCDM+S entropy-extended cosmology: thermodynamic derivation and Bayesian validation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Liam Desre" }]
keywords = ["cosmology", "LambdaCDM", "entropy", "Bayesian", "MCMC"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "sympy>=1.12",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
plots = ["getdist>=1.4"]
progress = ["rich>=13.0", "tqdm>=4.66"]
test = ["pytest>=8.0"]
all = ["lcdm-plus-s[app,plots,progress,test]"]

[project.urls]
Homepage = "https://github.com/USER/LambdaCDM-plus-S"
Documentation = "https://github.com/USER/LambdaCDM-plus-S#readme"

[project.scripts]
lcdms-solver = "lcdm_plus_s.analytical_solver:main"
lcdms-validate = "lcdm_plus_s.bayesian_validation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
